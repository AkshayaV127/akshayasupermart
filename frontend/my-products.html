<!DOCTYPE html>
<html>
<head>
    <title>My Products - AkshayaMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }

        .container {
            padding: 40px 50px;
        }

        .product {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .product h2 {
            margin-top: 0;
        }

        .product p {
            color: #666;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
        }

        .buttons {
            margin-top: 15px;
        }

        .edit-btn,
        .delete-btn {
            display: inline-block;
            padding: 10px 20px;
            margin-right: 10px;
            border-radius: 6px;
            background: #222;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">AkshayaMart - Seller</div>

        <a class="back" href="seller-dashboard.html">
            Dashboard
        </a>

    </div>

    <div class="container">

        <h1>My Products</h1>

        <div class="product">

            <h2>Women's Dress</h2>

            <p>Category: Fashion</p>

            <p>Stylish fashion dress</p>

            <p class="price">₹499</p>

            <p>Quantity: 20</p>

            <div class="buttons">

                <a class="edit-btn" href="edit-product.html">
                    Edit
                </a>

                <a class="delete-btn" href="my-products.html">
                    Delete
                </a>

            </div>

        </div>

        <div class="product">

            <h2>Smart Watch</h2>

            <p>Category: Electronics</p>

            <p>Modern smart watch</p>

            <p class="price">₹999</p>

            <p>Quantity: 15</p>

            <div class="buttons">

                <a class="edit-btn" href="edit-product.html">
                    Edit
                </a>

                <a class="delete-btn" href="my-products.html">
                    Delete
                </a>

            </div>

        </div>

    </div>

</body>
</html>
