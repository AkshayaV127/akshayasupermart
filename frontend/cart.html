<!DOCTYPE html>
<html>
<head>
    <title>AkshayaMart - Cart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            width: 85%;
            margin: 40px auto;
        }

        .cart-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .item {
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        .item img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin: 0 0 8px;
        }

        .price {
            font-weight: bold;
            font-size: 18px;
        }

        .quantity {
            padding: 8px;
            width: 60px;
        }

        .total {
            text-align: right;
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }

        .checkout-btn {
            display: block;
            margin-left: auto;
            margin-top: 20px;
            padding: 13px 30px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .continue {
            display: inline-block;
            margin-top: 20px;
            color: #333;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">AkshayaMart</div>
    </div>

    <div class="container">

        <h1>My Cart</h1>

        <div class="cart-box">

            <div class="item">

                <img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8">

                <div class="item-info">
                    <h3>Women's Dress</h3>
                    <p>Stylish fashion dress</p>
                    <div class="price">₹499</div>
                </div>

                <input
                    class="quantity"
                    type="number"
                    value="1"
                    min="1">

            </div>

            <div class="total">
                Total: ₹499
            </div>

            <a href="checkout.html">
                <button class="checkout-btn">
                    Proceed to Checkout
                </button>
            </a>

            <a class="continue" href="home.html">
                ← Continue Shopping
            </a>

        </div>

    </div>

</body>
</html>
