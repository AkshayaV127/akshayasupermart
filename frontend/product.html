<!DOCTYPE html>
<html>
<head>
    <title>AkshayaMart - Product</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 45px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            margin-right: 40px;
        }

        .search {
            flex: 1;
            max-width: 600px;
            padding: 13px 18px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 15px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            margin-left: 35px;
        }

        .nav-links a {
            text-decoration: none;
            color: #222;
        }

        .product-container {
            max-width: 1000px;
            margin: 45px auto;
            padding: 35px;
            background: white;
            border-radius: 16px;
            display: flex;
            gap: 50px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .product-image {
            width: 420px;
            height: 420px;
            background: #eeeeee;
            border-radius: 12px;
        }

        .product-details {
            flex: 1;
            padding-top: 20px;
        }

        .product-details h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .rating {
            margin-bottom: 20px;
            font-size: 16px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
        }

        .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .quantity {
            width: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .cart-button {
            width: 220px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .cart-button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">AkshayaMart</div>

        <input
            class="search"
            type="text"
            placeholder="Search for products..."
        >

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="#">Cart</a>
            <a href="#">Orders</a>
        </div>

    </div>

    <div class="product-container">

        <div class="product-image"></div>

        <div class="product-details">

            <h1>Fashion Product</h1>

            <div class="rating">
                ★★★★☆ 4.0
            </div>

            <div class="price">
                ₹499
            </div>

            <p class="description">
                This is a quality fashion product available
                at AkshayaMart. Choose this product and
                add it to your shopping cart.
            </p>

            <input
                class="quantity"
                type="number"
                value="1"
                min="1"
            >

            <br>

            <button class="cart-button">
                Add to Cart
            </button>

        </div>

    </div>

</body>
</html>
