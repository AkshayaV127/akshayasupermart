<!DOCTYPE html>
<html>
<head>
    <title>Manage Users - AkshayaMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }

        .container {
            padding: 40px 50px;
        }

        .user {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .user h2 {
            margin-top: 0;
        }

        .user p {
            color: #555;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">AkshayaMart - Admin</div>

        <a class="back" href="admin-dashboard.html">
            Dashboard
        </a>

    </div>

    <div class="container">

        <h1>Manage Users</h1>

        <div class="user">
            <h2>Akshaya</h2>
            <p>Email: akshaya@example.com</p>
            <p>Role: Buyer</p>
            <button>Remove User</button>
        </div>

        <div class="user">
            <h2>Priya</h2>
            <p>Email: priya@example.com</p>
            <p>Role: Seller</p>
            <button>Remove User</button>
        </div>

    </div>

</body>
</html>
