<!DOCTYPE html>
<html>
<head>
    <title>Products - AkshayaMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            margin-right: 40px;
        }

        .search {
            flex: 1;
            max-width: 550px;
            padding: 13px 18px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 15px;
        }

        .home {
            margin-left: 35px;
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }

        .container {
            padding: 40px 50px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .filters select {
            padding: 10px;
            margin-right: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .product-list {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .product {
            background: white;
            width: 230px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product h2 {
            font-size: 19px;
            margin: 12px 0 6px;
        }

        .rating {
            margin: 8px 0;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }

        .cart-btn {
            display: block;
            text-align: center;
            padding: 10px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">AkshayaMart</div>

        <input
            class="search"
            type="text"
            placeholder="Search for products..."
        >

        <a class="home" href="home.html">
            Home
        </a>

    </div>

    <div class="container">

        <h1>Browse Products</h1>

        <div class="filters">

            <strong>Filter:</strong>

            <select>
                <option>All Categories</option>
                <option>Fashion</option>
                <option>Beauty</option>
                <option>Electronics</option>
                <option>Mobiles</option>
            </select>

            <select>
                <option>Sort by Price</option>
                <option>Low to High</option>
                <option>High to Low</option>
            </select>

            <select>
                <option>Rating</option>
                <option>4 Stars & Above</option>
                <option>3 Stars & Above</option>
            </select>

        </div>

        <div class="product-list">

            <div class="product">

                <img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8">

                <h2>Women's Dress</h2>

                <p>Fashion</p>

                <div class="rating">★★★★☆ 4.2</div>

                <div class="price">₹499</div>

                <a class="cart-btn" href="cart.html">
                    Add to Cart
                </a>

            </div>

            <div class="product">

                <img src="https://images.unsplash.com/photo-1525507119028-ed4c629a60a3">

                <h2>Fashion Wear</h2>

                <p>Fashion</p>

                <div class="rating">★★★★★ 4.6</div>

                <div class="price">₹799</div>

                <a class="cart-btn" href="cart.html">
                    Add to Cart
                </a>

            </div>

            <div class="product">

                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">

                <h2>Smart Watch</h2>

                <p>Electronics</p>

                <div class="rating">★★★★☆ 4.4</div>

                <div class="price">₹999</div>

                <a class="cart-btn" href="cart.html">
                    Add to Cart
                </a>

            </div>

        </div>

    </div>

</body>
</html>
