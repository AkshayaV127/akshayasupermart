<!DOCTYPE html>
<html>
<head>
    <title>AkshayaMart - Checkout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            width: 85%;
            margin: 40px auto;
            display: flex;
            gap: 30px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .details {
            flex: 2;
        }

        .summary {
            flex: 1;
            height: fit-content;
        }

        h2 {
            margin-top: 0;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        .payment {
            margin: 15px 0;
        }

        .payment input {
            width: auto;
            margin-right: 8px;
        }

        .place-order {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">AkshayaMart</div>
    </div>

    <div class="container">

        <div class="box details">

            <h2>Checkout</h2>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number" required>

            <label>Delivery Address</label>
            <textarea placeholder="Enter your delivery address" required></textarea>

            <h2>Payment Method</h2>

            <div class="payment">
                <label>
                    <input type="radio" name="payment" checked>
                    Cash on Delivery
                </label>
            </div>

            <div class="payment">
                <label>
                    <input type="radio" name="payment">
                    UPI
                </label>
            </div>

            <div class="payment">
                <label>
                    <input type="radio" name="payment">
                    Card
                </label>
            </div>

        </div>

        <div class="box summary">

            <h2>Order Summary</h2>

            <div class="price-row">
                <span>Women's Dress</span>
                <span>₹499</span>
            </div>

            <div class="price-row">
                <span>Delivery</span>
                <span>Free</span>
            </div>

            <div class="price-row total">
                <span>Total</span>
                <span>₹499</span>
            </div>

            <a href="order.html">
                <button class="place-order">
                    Place Order
                </button>
            </a>

        </div>

    </div>

</body>
</html>
