<!DOCTYPE html>
<html>
<head>
    <title>AkshayaMart - Seller</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .nav-links {
            margin-left: auto;
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }

        .container {
            width: 85%;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .product {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        .product:last-child {
            border-bottom: none;
        }

        .product-info {
            flex: 1;
        }

        .product-info h3 {
            margin: 0 0 8px;
        }

        .price {
            font-weight: bold;
            font-size: 18px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .edit {
            background: #555;
        }

        .delete {
            background: #b00020;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">AkshayaMart</div>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </div>

    </div>

    <div class="container">

        <h1>Seller Dashboard</h1>

        <div class="box">

            <h2>Add Product</h2>

            <label>Product Name</label>
            <input
                type="text"
                id="productName"
                placeholder="Enter product name"
            >

            <label>Category</label>

            <select id="category">
                <option>Fashion</option>
                <option>Beauty</option>
                <option>Electronics</option>
                <option>Mobiles</option>
            </select>

            <label>Price</label>

            <input
                type="number"
                id="price"
                placeholder="Enter price"
            >

            <label>Quantity</label>

            <input
                type="number"
                id="quantity"
                placeholder="Enter quantity"
            >

            <button
                class="button"
                onclick="addProduct()">
                Add Product
            </button>

            <div id="message"></div>

        </div>

        <div class="box">

            <h2>My Products</h2>

            <div id="productList">

                <p>Loading products...</p>

            </div>

        </div>

    </div>

    <script>

        async function addProduct()
        {
            const name =
                document.getElementById("productName").value;

            const category =
                document.getElementById("category").value;

            const price =
                document.getElementById("price").value;

            const quantity =
                document.getElementById("quantity").value;

            if (
                name === "" ||
                price === "" ||
                quantity === ""
            )
            {
                document.getElementById("message").innerText =
                    "Please fill all fields";

                return;
            }

            try
            {
                const response =
                    await fetch(
                        "http://localhost:8080/api/products/add",
                        {
                            method: "POST",

                            headers:
                            {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body:
                                "name=" +
                                encodeURIComponent(name) +

                                "&category=" +
                                encodeURIComponent(category) +

                                "&price=" +
                                encodeURIComponent(price) +

                                "&quantity=" +
                                encodeURIComponent(quantity) +

                                "&seller_id=1"
                        }
                    );

                const result =
                    await response.json();

                document.getElementById("message").innerText =
                    result.message;

                if (result.status === "success")
                {
                    document.getElementById("productName").value = "";
                    document.getElementById("price").value = "";
                    document.getElementById("quantity").value = "";

                    loadProducts();
                }
            }
            catch (error)
            {
                document.getElementById("message").innerText =
                    "Backend server is not running";
            }
        }

        async function loadProducts()
        {
            try
            {
                const response =
                    await fetch(
                        "http://localhost:8080/api/products"
                    );

                const products =
                    await response.json();

                const list =
                    document.getElementById("productList");

                list.innerHTML = "";

                products.forEach(product =>
                {
                    const div =
                        document.createElement("div");

                    div.className = "product";

                    div.innerHTML =
                        `
                        <div class="product-info">

                            <h3>${product.name}</h3>

                            <p>
                                Category: ${product.category}
                            </p>

                            <div class="price">
                                ₹${product.price}
                            </div>

                            <p>
                                Quantity: ${product.quantity}
                            </p>

                        </div>

                        <div class="actions">

                            <button
                                class="button edit"
                                onclick="editProduct(
                                    ${product.id},
                                    '${product.name}',
                                    '${product.category}',
                                    ${product.price},
                                    ${product.quantity}
                                )">
                                Edit
                            </button>

                            <button
                                class="button delete"
                                onclick="deleteProduct(${product.id})">
                                Delete
                            </button>

                        </div>
                        `;

                    list.appendChild(div);
                });
            }
            catch (error)
            {
                document.getElementById("productList").innerHTML =
                    "<p>Backend server is not running</p>";
            }
        }

        async function editProduct(
            id,
            oldName,
            oldCategory,
            oldPrice,
            oldQuantity
        )
        {
            const name =
                prompt(
                    "Enter product name:",
                    oldName
                );

            if (name === null)
                return;

            const price =
                prompt(
                    "Enter price:",
                    oldPrice
                );

            if (price === null)
                return;

            const quantity =
                prompt(
                    "Enter quantity:",
                    oldQuantity
                );

            if (quantity === null)
                return;

            try
            {
                const response =
                    await fetch(
                        "http://localhost:8080/api/products/update",
                        {
                            method: "POST",

                            headers:
                            {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body:
                                "id=" +
                                id +

                                "&name=" +
                                encodeURIComponent(name) +

                                "&category=" +
                                encodeURIComponent(oldCategory) +

                                "&price=" +
                                encodeURIComponent(price) +

                                "&quantity=" +
                                encodeURIComponent(quantity)
                        }
                    );

                const result =
                    await response.json();

                alert(result.message);

                if (result.status === "success")
                {
                    loadProducts();
                }
            }
            catch (error)
            {
                alert("Backend server is not running");
            }
        }

        async function deleteProduct(id)
        {
            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this product?"
                );

            if (!confirmDelete)
                return;

            try
            {
                const response =
                    await fetch(
                        "http://localhost:8080/api/products/delete",
                        {
                            method: "POST",

                            headers:
                            {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body:
                                "id=" + id
                        }
                    );

                const result =
                    await response.json();

                alert(result.message);

                if (result.status === "success")
                {
                    loadProducts();
                }
            }
            catch (error)
            {
                alert("Backend server is not running");
            }
        }

        loadProducts();

    </script>

</body>
</html>
