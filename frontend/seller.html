<!DOCTYPE html>
<html>
<head>
    <title>AkshayaMart - Seller</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .nav-links {
            margin-left: auto;
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }

        .container {
            width: 85%;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .product {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        .product:last-child {
            border-bottom: none;
        }

        .product-info {
            flex: 1;
        }

        .product-info h3 {
            margin: 0 0 8px;
        }

        .price {
            font-weight: bold;
            font-size: 18px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .edit {
            background: #555;
        }

        .delete {
            background: #b00020;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">AkshayaMart</div>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </div>

    </div>

    <div class="container">

        <h1>Seller Dashboard</h1>

        <div class="box">

            <h2>Add Product</h2>

            <label>Product Name</label>
            <input
                type="text"
                placeholder="Enter product name"
            >

            <label>Category</label>
            <select>
                <option>Fashion</option>
                <option>Beauty</option>
                <option>Electronics</option>
                <option>Mobiles</option>
            </select>

            <label>Price</label>
            <input
                type="number"
                placeholder="Enter price"
            >

            <label>Quantity</label>
            <input
                type="number"
                placeholder="Enter quantity"
            >

            <button class="button">
                Add Product
            </button>

        </div>

        <div class="box">

            <h2>My Products</h2>

            <div class="product">

                <div class="product-info">
                    <h3>Women's Dress</h3>
                    <p>Category: Fashion</p>
                    <div class="price">₹499</div>
                    <p>Quantity: 10</p>
                </div>

                <div class="actions">

                    <button class="button edit">
                        Edit
                    </button>

                    <button class="button delete">
                        Delete
                    </button>

                </div>

            </div>

            <div class="product">

                <div class="product-info">
                    <h3>Smart Watch</h3>
                    <p>Category: Electronics</p>
                    <div class="price">₹999</div>
                    <p>Quantity: 5</p>
                </div>

                <div class="actions">

                    <button class="button edit">
                        Edit
                    </button>

                    <button class="button delete">
                        Delete
                    </button>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
