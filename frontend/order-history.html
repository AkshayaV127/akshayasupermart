<!DOCTYPE html>
<html>
<head>
    <title>Order History - AkshayaMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }

        .container {
            padding: 40px 50px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .order {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .order h2 {
            margin-top: 0;
        }

        .order p {
            color: #555;
            margin: 8px 0;
        }

        .status {
            font-weight: bold;
            margin-top: 15px;
        }

        .review-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">AkshayaMart</div>

        <a class="back" href="home.html">
            Home
        </a>

    </div>

    <div class="container">

        <h1>My Orders</h1>

        <div class="order">

            <h2>Order #AKM1001</h2>

            <p><strong>Product:</strong> Women's Dress</p>
            <p><strong>Quantity:</strong> 2</p>
            <p><strong>Total:</strong> ₹998</p>
            <p><strong>Payment:</strong> Cash on Delivery</p>

            <p class="status">Status: Delivered</p>

            <a class="review-btn" href="review.html">
                Give Review
            </a>

        </div>

        <div class="order">

            <h2>Order #AKM1002</h2>

            <p><strong>Product:</strong> Smart Watch</p>
            <p><strong>Quantity:</strong> 1</p>
            <p><strong>Total:</strong> ₹999</p>
            <p><strong>Payment:</strong> UPI</p>

            <p class="status">Status: Order Placed</p>

        </div>

    </div>

</body>
</html>
